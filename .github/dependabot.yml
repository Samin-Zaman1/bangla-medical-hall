version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    # Batch the routine bumps so CI runs once per group, not once per package.
    groups:
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "@axe-core/*", "@testing-library/*", "jsdom", "@electric-sql/pglite"]
      lint-and-types:
        patterns: ["eslint*", "@types/*", "typescript"]
      minor-and-patch:
        update-types: [minor, patch]
    # Majors need a human read of the changelog (and @types/node must track the Node
    # version in .nvmrc), so they're upgraded by hand rather than by Dependabot.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Dhaka
    groups:
      actions:
        patterns: ["*"]
