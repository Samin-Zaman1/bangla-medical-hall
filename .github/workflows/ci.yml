name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to a PR cancels its in-flight run; runs on master always finish (CD depends on them).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit, component & DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Vitest (unit + components + PGlite migrations/RPCs)
        run: npx vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=html --reporter=default --reporter=junit --outputFile.junit=test-results/vitest/junit.xml
      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results
          path: |
            coverage/
            test-results/vitest/
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-stack
      - name: Playwright — desktop Chromium, phone viewport, smoke
        run: npx playwright test --project=chromium --project=mobile --project=smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/e2e/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  # One stable status to require in branch protection, whatever the job list becomes.
  ci-passed:
    name: CI passed
    if: always()
    needs: [quality, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
