name: Cross-browser

# The full matrix PRs skip for speed: every E2E test on Chromium, Firefox and WebKit, plus a
# dependency audit. Manual only (Actions → Cross-browser → Run workflow), e.g. before a release.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  e2e-all-browsers:
    name: E2E — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-stack
        with:
          # The `setup` project signs in with Chromium before any browser project runs,
          # so Chromium is needed alongside the browser under test.
          browsers: ${{ matrix.browser == 'chromium' && 'chromium' || format('chromium {0}', matrix.browser) }}
      - run: npx playwright test --project=${{ matrix.browser }}
        env:
          E2E_BROWSERS: all
          # WebKit drops Secure cookies on http://localhost, so it runs against `next dev`
          # (non-Secure cookies) instead of the production build. See playwright.config.ts.
          E2E_DEV_SERVER: ${{ matrix.browser == 'webkit' && '1' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-browser-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
      - if: always()
        run: npx supabase stop --no-backup

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
