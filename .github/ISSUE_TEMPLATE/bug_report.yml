name: Bug report
description: Something in the app isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as staff
        2. Open Make a Sale
        3. …
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Signed in as
      options: [Owner, Staff, Wholesaler, Not signed in]
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: e.g. Windows counter PC, Chrome 140
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error messages
